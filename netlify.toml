# Configuração de deploy da AuriNutri no Netlify.
#
# O plugin @netlify/plugin-nextjs é o adaptador oficial da Netlify para
# Next.js (App Router). Ele converte automaticamente:
#   - Server Components / rotas dinâmicas -> Netlify Functions
#   - Server Actions ("use server")        -> Netlify Functions
#   - middleware.ts                         -> Netlify Edge Functions
#   - Route Handlers (app/**/route.ts)      -> Netlify Functions
# Não é necessário (nem recomendado) usar `output: "export"` ou
# `output: "standalone"` no next.config.mjs — o plugin cuida disso.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Endereços antigos/alternativos levam ao sistema, que mora em app.aurinutri.com.
# O netlify.app também: links de PDF já enviados a pacientes continuam
# funcionando, só passam a abrir no domínio próprio.
[[redirects]]
  from = "https://aurinutri-app.netlify.app/*"
  to = "https://app.aurinutri.com/:splat"
  status = 301
  force = true

# aurinutri.com (e www) levam ao sistema;
# aurinutri.com fica reservado para uma futura página de apresentação/vendas —
# quando ela existir, é só remover estas duas regras.
[[redirects]]
  from = "https://aurinutri.com/*"
  to = "https://app.aurinutri.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.aurinutri.com/*"
  to = "https://app.aurinutri.com/:splat"
  status = 301
  force = true
